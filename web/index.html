<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>upm · A fast, tiny package manager for npm</title>
    <meta
      name="description"
      content="A fast, tiny package manager for the npm registry, written in TypeScript. Pure JS, zero dependencies. Try any package in your browser."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://upm.sh/" />
    <link rel="alternate" type="text/markdown" href="/README.md" title="upm docs" />
    <!-- The spec box's suggestions and the app both ask the registry: open the connection early. -->
    <link rel="preconnect" href="https://registry.npmjs.org" crossorigin />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      data-scheme="light"
      content="#fafafa"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      data-scheme="dark"
      content="#0f0f11"
    />
    <script>
      // The theme picked with the toggle (src/theme.ts), set before the page paints.
      try {
        const theme = localStorage.getItem("theme");
        if (theme) document.documentElement.dataset.theme = theme;
      } catch {}
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="upm" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://upm.sh/" />
    <meta property="og:title" content="upm · A fast, tiny package manager for npm" />
    <meta
      property="og:description"
      content="Pure JS, tiny, zero dependencies. Try any package in your browser."
    />
    <meta property="og:image" content="https://upm.sh/og.png" />
    <meta property="og:image:secure_url" content="https://upm.sh/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="upm: a fast, tiny package manager for the npm registry. Native speed in pure TypeScript with no binary and zero dependencies, drop-in with npm, pnpm and bun lockfiles, and a JS API: await install(). upm.sh"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@_pi0_" />
    <meta name="twitter:title" content="upm · A fast, tiny package manager for npm" />
    <meta
      name="twitter:description"
      content="Pure JS, tiny, zero dependencies. Try any package in your browser."
    />
    <meta name="twitter:image" content="https://upm.sh/og.png" />
    <meta
      name="twitter:image:alt"
      content="upm: a fast, tiny package manager for the npm registry. Native speed in pure TypeScript with no binary and zero dependencies, drop-in with npm, pnpm and bun lockfiles, and a JS API: await install(). upm.sh"
    />

    <!-- Inlined by Vite, so the landing's skeleton is styled with the page, before any script. -->
    <style>
      @import "/src/style.css";
    </style>
  </head>
  <body>
    <!-- The landing's layout (src/landing.ts) with bars for its content, so nothing moves when it
      mounts. Hidden text keeps each bar the size its words wrap to. -->
    <div id="root">
      <div role="status" aria-label="Loading" class="animate-appear">
        <main class="relative flex min-h-dvh flex-col px-4 motion-safe:animate-pulse sm:px-8">
          <div class="absolute top-3 right-4 flex items-center gap-3 sm:right-8">
            <div class="h-6.5 w-13 rounded-md bg-zinc-200/80 dark:bg-zinc-800"></div>
            <div class="h-4 w-11 rounded bg-zinc-200/80 dark:bg-zinc-800"></div>
            <div class="size-6.5 rounded-md bg-zinc-200/80 dark:bg-zinc-800"></div>
          </div>
          <div class="min-h-20 flex-1"></div>
          <div
            class="mx-auto h-16 w-47 rounded-xl bg-zinc-200/80 sm:h-20 sm:w-59 dark:bg-zinc-800"
          ></div>
          <p class="mt-6 text-center text-transparent select-none sm:mt-8">
            <span class="rounded bg-zinc-200/80 box-decoration-clone dark:bg-zinc-800"
              >A fast, tiny package manager for the npm registry</span
            >
          </p>
          <div
            class="mx-auto mt-3 h-13 w-full max-w-2xl rounded-xl border border-zinc-300 bg-(--editor-bg) shadow-sm dark:border-zinc-700"
          ></div>
          <div
            class="mt-4 flex flex-wrap justify-center gap-1.5 font-mono text-xs text-transparent select-none"
          >
            <span
              class="rounded-md border border-transparent bg-zinc-200/80 px-1.5 py-0.5 dark:bg-zinc-800"
              >vite</span
            >
            <span
              class="rounded-md border border-transparent bg-zinc-200/80 px-1.5 py-0.5 dark:bg-zinc-800"
              >vue</span
            >
            <span
              class="rounded-md border border-transparent bg-zinc-200/80 px-1.5 py-0.5 dark:bg-zinc-800"
              >nuxt</span
            >
            <span
              class="rounded-md border border-transparent bg-zinc-200/80 px-1.5 py-0.5 dark:bg-zinc-800"
              >next</span
            >
            <span
              class="rounded-md border border-transparent bg-zinc-200/80 px-1.5 py-0.5 dark:bg-zinc-800"
              >@tanstack/react-start</span
            >
            <span
              class="rounded-md border border-transparent bg-zinc-200/80 px-1.5 py-0.5 dark:bg-zinc-800"
              >nitro</span
            >
            <span
              class="rounded-md border border-transparent bg-zinc-200/80 px-1.5 py-0.5 dark:bg-zinc-800"
              >h3</span
            >
            <span
              class="rounded-md border border-transparent bg-zinc-200/80 px-1.5 py-0.5 dark:bg-zinc-800"
              >express</span
            >
          </div>
          <div class="mt-8 flex justify-center gap-3">
            <div class="h-9.5 w-24 rounded-full bg-zinc-200/80 dark:bg-zinc-800"></div>
            <div class="h-9.5 w-28 rounded-full bg-zinc-200/80 dark:bg-zinc-800"></div>
          </div>
          <div class="flex flex-1 flex-col items-center justify-center py-10">
            <div
              class="w-full max-w-lg overflow-hidden rounded-2xl border border-zinc-200 bg-(--editor-bg) dark:border-zinc-800"
            >
              <div class="border-b border-zinc-200 bg-(--chrome-bg) px-5 py-3 dark:border-zinc-800">
                <div class="h-5 w-28 rounded bg-zinc-200/80 dark:bg-zinc-800"></div>
              </div>
              <div class="p-5">
                <div class="h-11 rounded-xl bg-zinc-200/80 dark:bg-zinc-800"></div>
                <p class="mt-3 text-sm text-transparent select-none">
                  <span class="rounded bg-zinc-200/80 box-decoration-clone dark:bg-zinc-800"
                    >Works with ⬢ Node.js, your existing .npmrc and npm, pnpm or bun lockfiles.
                    Tiny, with zero dependencies.</span
                  >
                </p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script>
      // Only the landing has this layout; the other routes start blank.
      if (location.pathname !== "/") document.getElementById("root").replaceChildren();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
