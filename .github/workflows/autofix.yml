name: autofix.ci
on: { push: {}, pull_request: {} }
permissions: { contents: read }
jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: lts/* }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.upm/store
          key: upm-store-${{ runner.os }}-${{ hashFiles('upm.lock') }}
          restore-keys: upm-store-${{ runner.os }}-
      # Not --frozen-lockfile: a stale upm.lock is refreshed here and committed below.
      - run: node ./upm install
      - run: npm run fmt
      - uses: autofix-ci/action@7a166d7532b277f34e16238930461bf77f9d7ed8
        with: { commit-message: "chore: apply automated updates" }
