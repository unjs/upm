name: checks
on: { push: {}, pull_request: {} }
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: lts/* }
      # upm's own store, so a warm run links from cache instead of refetching.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.upm/store
          key: upm-store-${{ runner.os }}-${{ hashFiles('upm.lock') }}
          restore-keys: upm-store-${{ runner.os }}-
      - run: node ./upm install --frozen-lockfile
      # Extras run once, on Linux.
      - if: runner.os == 'Linux'
        run: npm run typecheck
      - if: runner.os == 'Linux'
        run: npx vitest --coverage
      # Through npx, so the shell has to find the bin: a `.cmd` shim on Windows.
      - if: runner.os != 'Linux'
        run: npx vitest run
      - if: runner.os == 'Linux'
        run: npm run lint
      # - uses: codecov/codecov-action@v5
      #   with: { token: "${{ secrets.CODECOV_TOKEN }}" }
